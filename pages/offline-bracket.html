<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
    (function () {
        var base = '/';
        if (/\.github\.io$/i.test(location.hostname)) {
            var seg = location.pathname.split('/').filter(Boolean)[0];
            if (seg) base = '/' + seg + '/';
        }
        document.write('<base href="' + base + '">');
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Bracket Render</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            background: #ece8e1;
            overflow: hidden;
        }
        #bracket-canvas {
            display: block;
            width: 1280px;
            height: 720px;
            background: #ece8e1;
        }
    </style>
</head>
<body>
    <canvas id="bracket-canvas" width="1280" height="720" aria-label="Offline tournament bracket"></canvas>
    <script src="sound-effects/howler.min.js"></script>
    <script src="sound-effects/zzfx.js"></script>
    <script src="arena/arena-audio.js"></script>

    <script src="premade-weapons/staff.js"></script>
    <script src="premade-weapons/shield.js"></script>
    <script src="premade-weapons/webs.js"></script>
